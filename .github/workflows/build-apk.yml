name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # app/build.gradle pins these exact versions; the runner image may not ship them.
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v6

      # gradlew is committed without the executable bit.
      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: CamSwap-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Reported separately so a failing JVM test does not block the APK artifact.
      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew :app:testReleaseUnitTest --stacktrace
